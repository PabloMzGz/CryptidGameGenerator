<!DOCTYPE html>
<html>
	<head>
		<title>Cryptid</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://fonts.googleapis.com/css?family=Alegreya" rel="stylesheet">
		<link rel="stylesheet" href="w3.css">
		<link rel="stylesheet" href="cryptid.css">
		<style>
			.w3-alegreya {
				font-family: 'Alegreya', serif;
				font-variant: small-caps;
				letter-spacing: 3px;
			}
		</style>
		<script src="js/lib/jquery-3.3.1.min.js"></script>
		<script src="js/lib/howler.min.js"></script>
		<script src="js/lib/js.cookies.js"></script>
		<script src="lang_settings.js"></script>
		<!-- Cryptid modules (replaces cryptid.3.min.js) -->
	<script src="js/namespace.js"></script>
	<script src="js/i18n.js"></script>
	<script src="js/errors.js"></script>
	<script src="js/mapData.js"></script>
	<script src="js/mapRenderer.js"></script>
	<script src="js/settings.js"></script>
	<script src="js/sound.js"></script>
	<script src="js/tutorial.js"></script>
	<script src="js/gameGenerator.js"></script>
	<script src="js/gameStore.js"></script>
	<script src="js/game.js"></script>
	<script src="js/sharing.js"></script>
	<script src="js/app.js"></script>
		<link rel="icon" type="image/png" href="./img/favicon.png">
	</head>
    <body class="cryptid-background">
	<!-- MOBILE SIDE MENU -->
	<div class="w3-sidebar w3-bar-block w3-border-right w3-animate-left cryptid-highlight" style="display:none" id="mobile_side_menu">
		<button id="mobile_side_close" class="w3-bar-item w3-large">Close &times;</button>
		<div class="w3-bar-item cryptid-highlight">
			<label class="switch cryptid-valign-middle w3-margin-right">
				<input type="checkbox" id="mob_tutorial" data-setting="tutorial">
				<span class="slider round"></span>
			</label>
			<span data-tkey="settings_tutorial_label"></span>
		</div>
		<div class="w3-bar-item cryptid-highlight">
			<label class="switch cryptid-valign-middle w3-margin-right">
				<input type="checkbox" id="mob_bgm" data-setting="bgm">
				<span class="slider round"></span>
			</label>
			<span data-tkey="general_bgm"></span>
		</div>
		<div class="w3-bar-item cryptid-highlight">
			<label class="switch cryptid-valign-middle w3-margin-right">
				<input type="checkbox" id="mob_sfx" data-setting="sfx">
				<span class="slider round"></span>
			</label>
			<span data-tkey="general_sfx"></span>
		</div>
		<div class="cryptid-highlight cryptid-hover-highlight cryptid-lang-menu lang-highlight">
			<label for="menuLangMob"><img src="img/flags/en.png" class="lang-flag"></label>
			<select id="menuLangMob" data-setting="lang" class="cryptid-hover-highlight cryptid-highlight lang-highlight lang-drop">
			</select>
		</div>
	</div>
		
		<!-- MOBILE MENU -->
        <div class="w3-top w3-hide-medium w3-hide-large" id="mobile_top_menu">
            <div class="w3-container cryptid-title">
				<span class="w3-xlarge w3-margin-right mobile-burger">☰</span>
				<span class="w3-alegreya title">Cryptid</span>
				<a href="https://ospreypublishing.com/store/osprey-games" data-tkey="link_home">
					<img src="img/logos/en.small.png" alt="Logo" class="right logo" data-size="small">
				</a>	
				<label for="smallBgm" class="image-button">
					<input type="checkbox" id="smallBgm" data-setting="bgm">
					<img src="img/bgm25.png" alt="Background Music" class="thumb right">
				</label>
				<label for="smallSfx" class="image-button">
					<input type="checkbox" id="smallSfx" data-setting="sfx">
					<img src="img/sfx.png" alt="Sound Effects" class="thumb right">
				</label>
				<img class="right lang-flag" src="img/flags/en.png" id="topFlag">
			</div>
        </div>
				
        <div class="cryptid-maxwidth">
			<div class="w3-row-padding">
				<!-- DESKTOP MENU -->
				<div class="w3-third w3-hide-small w3-center" id="menuPanelLarge">
				<div id="menuLarge" class="w3-card w3-bar-block cryptid-cream w3-margin-bottom">
					<div id="logoDisplayLarge" class="cryptid-house">
						<img src="img/Cryptid_Title.png" id="logoLargeImg" alt="Cryptid Logo" style="max-width: 100%; max-height: 100%;">
					</div>
					<div class="w3-bar-item cryptid-highlight">
						<label class="switch cryptid-valign-middle w3-margin-right">
							<input type="checkbox" id="desk_tutorial" data-setting="tutorial">
							<span class="slider round"></span>
						</label>
						<span data-tkey="settings_tutorial_label"></span>
					</div>
					<div class="w3-bar-item cryptid-highlight">
						<label class="switch cryptid-valign-middle w3-margin-right">
							<input type="checkbox" id="desk_bgm" data-setting="bgm">
							<span class="slider round"></span>
						</label>
						<span data-tkey="general_bgm"></span>
					</div>
					<div class="w3-bar-item cryptid-highlight">
						<label class="switch cryptid-valign-middle w3-margin-right">
							<input type="checkbox" id="desk_sfx" data-setting="sfx">
							<span class="slider round"></span>
						</label>
						<span data-tkey="general_sfx"></span>
					</div>
					<div class="cryptid-highlight cryptid-hover-highlight cryptid-lang-menu">
						<label for="menuLang"><img src="img/flags/en.png" class="lang-flag"></label>
						<select id="menuLang" data-setting="lang" class="cryptid-hover-highlight cryptid-highlight lang-drop">
						</select>
					</div>
				</div>
					<div id="mapAnchor"></div>
					<div class="w3-left-align cryptid-music-buttons">
						<div id="osprey-logo">
							<a href="https://ospreypublishing.com/store/osprey-games" target="_blank" data-tkey="link_home">
								<img src="img/logos/en.large.png" style="margin-bottom: -10px" class="logo" data-size="large">
							</a>
						</div>
					</div>
				</div>


				<div class="w3-twothird w3-center" id="mainPanel">
					<div id="game-elements">

					<!-- Tutorial panel -->
					<div id="tut_container" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div class="w3-left-align cryptid-tut w3-padding-small">
							<span class="cryptid-tut-x" id="tut_close">×</span>
							<span class="w3-alegreya cryptid-title-size" data-tkey="tut_title"></span>
						</div>
						<div class="w3-padding w3-left-align">
							<span  id="tut_body"></span>
							<br />
							<div id="tut_buttons" class="cryptid-tut-buttons">
								<button id="tut_prev" data-tkey="tut_prev" class="w3-button cryptid-highlight cryptid-hover-highlight"></button>
								<span></span>
								<button id="tut_next" data-tkey="tut_next" class="w3-button cryptid-highlight cryptid-hover-highlight"></button>
							</div>
						</div>
					</div>

					<div class="cryptid-hide game-gameplay">
					<div id="gameMapAnchor">
					<!-- Map display -->
					<div id="mapDiv" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="mapCollapse" class="w3-hover-light-grey w3-left-align" onclick="window.cryptid.map.toggleExpand()">
							<h4 class="cryptid-highlight cryptid-hover-highlight w3-alegreya w3-padding-small"><span id="mapCollapseArrow" class="w3-text-dark-grey">[–]</span> <span data-tkey="map_title"></span></h4>
						</div>
						<canvas id="mapCanvas" width="640" height="520" class="cryptid-hide"></canvas>
					</div>
					</div>
					</div>
						
					<!-- Loading dialog -->
					<div id="loadingDialog" class="w3-card cryptid-cream">
						<div id="loadingTitle" class="w3-left-align w3-margin-bottom">
							<h4 class="w3-alegreya w3-padding-small" data-tkey="loading_title"></h4>
						</div>
						<div id="loadingDialogContent" class="w3-padding" data-tkey="loading_local">
						</div>
					</div>

					<div class="cryptid-hide game-gameplay">
					<!-- Single-player clue view (loaded via ?player= URL parameter) -->
					<div id="playerClueDiv" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" id="playerClueHeader" data-tkey="clue_title" data-tpnum="1"></h4>
						</div>
						<div class="w3-padding">
							<div id="playerClueText" class="cryptid-heightblock w3-margin-bottom w3-margin-top w3-left-align cryptid-hide"></div>
							<button id="playerClueBtn" class="w3-block w3-button cryptid-highlight cryptid-hover-highlight w3-margin-bottom" data-tkey="clue_button_show" data-tpnum="1" onclick="window.cryptid.game.togglePlayerClue()"></button>
						</div>
					</div>

					<!-- Setup clue display div -->
					<div id="clueDiv" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="clueTitle" class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" id="clueHeader" data-tkey="clue_title" data-tpnum="1"></h4>
						</div>
						<div class="w3-padding">
							<div class="cryptid-heightblock w3-margin-bottom w3-margin-top">
								<span id="clueText" class="cryptid-hide"></span>
							</div>
							<button id="clueButton" class="w3-block w3-button cryptid-highlight cryptid-hover-highlight w3-margin-bottom" data-tkey="clue_button_show" data-tpnum="1">
							</button>
						</div>
					</div>

					<!-- Clue reminder button container -->
					<div id="clueReminderDiv" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="reminderPlaceholder" class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="reminder_title"></h4>
						</div>
						<div class="w3-padding">
							<div class="cryptid-heightblock w3-margin-bottom">
								<span id="reminderClueText" data-tkey="reminder_instruction"></span>
							</div>

							<button id="passTheDeviceBtn" class="w3-margin-bottom w3-block w3-button cryptid-highlight cryptid-hover-highlight cryptid-hide" data-tkey="reminder_pass_device" onclick="window.cryptid.game.enablePassTheDevice()"></button>
							<button id="reminder1" data-pnum="1" class="w3-margin-bottom w3-block w3-button cryptid-highlight cryptid-hover-highlight" data-tkey="player_1"></button>
							<button id="reminder2" data-pnum="2" class="w3-margin-bottom w3-block w3-button cryptid-highlight cryptid-hover-highlight" data-tkey="player_2"></button>
							<button id="reminder3" data-pnum="3" class="w3-margin-bottom w3-block w3-button cryptid-highlight cryptid-hover-highlight" data-tkey="player_3"></button>
							<button id="reminder4" data-pnum="4" class="w3-margin-bottom w3-block w3-button cryptid-highlight cryptid-hover-highlight" data-tkey="player_4"></button>
							<button id="reminder5" data-pnum="5" class="w3-margin-bottom w3-block w3-button cryptid-highlight cryptid-hover-highlight" data-tkey="player_5"></button>
						</div>
					</div>

					<!-- Cheat Sheet -->
					<div id="cheatSheetDiv" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="cheat_title"></h4>
						</div>
						<div class="w3-padding">
							<button id="cheatSheetBtn" class="w3-block w3-button cryptid-highlight cryptid-hover-highlight w3-margin-bottom" onclick="window.cryptid.game.toggleCheatSheet()" data-tkey="cheat_show"></button>
							<div id="cheatSheetBody" class="cryptid-hide w3-left-align">

								<!-- Topography section -->
								<div class="cheat-section-title" data-tkey="cheat_section_topography"></div>
								<div class="w3-margin-bottom">
									<div class="cheat-legend-section">
										<span class="w3-small cheat-legend-label" data-tkey="cheat_legend_terrain"></span>
										<div class="cheat-legend-row">
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 8.66" width="28" height="24"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="#4488cc"/></svg><span class="w3-small" data-tkey="cheat_terrain_water"></span></span>
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 8.66" width="28" height="24"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="#888888"/></svg><span class="w3-small" data-tkey="cheat_terrain_mountain"></span></span>
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 8.66" width="28" height="24"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="#4a9a4a"/></svg><span class="w3-small" data-tkey="cheat_terrain_forest"></span></span>
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 8.66" width="28" height="24"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="#7b52a8"/></svg><span class="w3-small" data-tkey="cheat_terrain_swamp"></span></span>
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 8.66" width="28" height="24"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="#d4b44a"/></svg><span class="w3-small" data-tkey="cheat_terrain_desert"></span></span>
										</div>
									</div>
									<div class="cheat-legend-section w3-margin-top">
										<span class="w3-small cheat-legend-label" data-tkey="cheat_legend_animal"></span>
										<div class="cheat-legend-row">
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="-0.7 -0.7 11.4 10.06" width="50" height="43"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="none" stroke="#cc2222" stroke-width="1.2"/></svg><span class="w3-small" data-tkey="cheat_animal_cougar"></span></span>
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="-0.7 -0.7 11.4 10.06" width="50" height="43"><polygon points="2.5,0 7.5,0 10,4.33 7.5,8.66 2.5,8.66 0,4.33" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="2 1.5"/></svg><span class="w3-small" data-tkey="cheat_animal_bear"></span></span>
										</div>
									</div>
									<div class="cheat-legend-section w3-margin-top">
										<span class="w3-small cheat-legend-label" data-tkey="cheat_legend_structure"></span>
										<div class="cheat-legend-row">
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 10" width="46" height="46"><polygon points="3,0 7,0 10,3 10,7 7,10 3,10 0,7 0,3" fill="#222222"/></svg><span class="w3-small" data-tkey="cheat_struct_stone"></span></span>
											<span class="cheat-legend-item"><svg class="cheat-icon" viewBox="0 0 10 10" width="46" height="46"><polygon points="5,0.5 9.5,9.5 0.5,9.5" fill="#222222"/></svg><span class="w3-small" data-tkey="cheat_struct_shack"></span></span>
										</div>
									</div>
								</div>

								<hr class="w3-border-grey w3-margin-top w3-margin-bottom">

								<!-- Clues section -->
								<div class="cheat-section-title" data-tkey="cheat_section_clues"></div>
								<div class="cheat-group w3-margin-top">
									<div class="cheat-group-header w3-small" data-tkey="cheat_group_on"></div>
									<ul class="cheat-clue-list w3-small">
										<li data-tkey="forest_or_mountain"></li>
										<li data-tkey="forest_or_desert"></li>
										<li data-tkey="forest_or_swamp"></li>
										<li data-tkey="water_or_forest"></li>
										<li data-tkey="water_or_desert"></li>
										<li data-tkey="water_or_swamp"></li>
										<li data-tkey="water_or_mountain"></li>
										<li data-tkey="desert_or_swamp"></li>
										<li data-tkey="desert_or_mountain"></li>
										<li data-tkey="mountain_or_swamp"></li>
									</ul>
								</div>

								<div class="cheat-group w3-margin-top">
									<div class="cheat-group-header w3-small" data-tkey="cheat_group_within1"></div>
									<ul class="cheat-clue-list w3-small">
										<li data-tkey="within_forest"></li>
										<li data-tkey="within_water"></li>
										<li data-tkey="within_swamp"></li>
										<li data-tkey="within_mountain"></li>
										<li data-tkey="within_desert"></li>
										<li data-tkey="within_animal"></li>
									</ul>
								</div>

								<div class="cheat-group w3-margin-top">
									<div class="cheat-group-header w3-small" data-tkey="cheat_group_within2"></div>
									<ul class="cheat-clue-list w3-small">
										<li data-tkey="within_animal_cougar"></li>
										<li data-tkey="within_animal_bear"></li>
										<li data-tkey="within_stone"></li>
										<li data-tkey="within_shack"></li>
									</ul>
								</div>

								<div class="cheat-group w3-margin-top">
									<div class="cheat-group-header w3-small" data-tkey="cheat_group_within3"></div>
									<ul class="cheat-clue-list w3-small">
										<li data-tkey="within_green"></li>
										<li data-tkey="within_blue"></li>
										<li data-tkey="within_white"></li>
										<li data-tkey="within_black"></li>
									</ul>
								</div>

								<hr class="w3-border-grey w3-margin-top w3-margin-bottom">

								<!-- Turn actions section -->
								<div class="cheat-section-title" data-tkey="cheat_section_turns"></div>
								<p class="w3-margin-top w3-margin-bottom">
									<strong data-tkey="cheat_turns_ask_title"></strong><br>
									<span class="w3-small" data-tkey="cheat_turns_ask_body"></span>
								</p>
								<p class="w3-margin-bottom">
									<strong data-tkey="cheat_turns_search_title"></strong><br>
									<span class="w3-small" data-tkey="cheat_turns_search_body"></span>
								</p>

							</div>
						</div>
					</div>

					<!-- Hint display -->
					<div id="hintDiv" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="hintTitle" class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="hint_title"></h4>
						</div>
						<div class="w3-padding">
							<div class="cryptid-heightblock w3-margin-bottom w3-margin-top">
								<span id="hintText"></span>
							</div>
						</div>
						<div id="hintConfirm" class="w3-modal">
							<div class="w3-modal-content cryptid-cream">
								<div class="w3-container w3-padding-large">
									<span onclick="document.getElementById('hintConfirm').style.display = 'none'" class="w3-button w3-display-topright">&times;</span>
									<br>
									<span data-tkey="hint_confirm">
									</span>
									<button id="hint_confirm_yes" class="w3-margin-bottom w3-block w3-button w3-green w3-hover-light-green w3-margin-top" onclick="window.cryptid.game.hintShow();document.getElementById('hintConfirm').style.display = 'none';" data-tkey="hint_yes_button"></button>
									<button id="hint_confirm_no" class="w3-margin-bottom w3-block w3-button w3-red w3-hover-pale-red" onclick="document.getElementById('hintConfirm').style.display = 'none'" data-tkey="hint_no_button"></button>
								</div>
							</div>
						</div>
					</div>

					<!-- Clue reveal container -->
					<div id="clueReveal" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="clueRevealTitle" class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="reveal_title"></h4>
						</div>
						<div class="w3-padding">
							<ol id="revealList" class="cryptid-list w3-left-align">
							</ol>
						</div>
					</div>

					<!--- Display habitat -->
					<div id="targetDisp" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="targetTitle" class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="target_title"></h4>
						</div>
						<div class="w3-padding">
							<button id="targetButton" class="w3-margin-bottom w3-margin-top w3-block w3-button cryptid-highlight cryptid-hover-highlight" onclick="window.cryptid.game.targetConfirm()" data-tkey="target_button"></button>
						</div>
						<div id="targetConfirm" class="w3-modal">
							<div class="w3-modal-content cryptid-cream">
								<div class="w3-container w3-padding-large">
									<span onclick="document.getElementById('targetConfirm').style.display = 'none'" class="w3-button w3-display-topright">&times;</span>
									<br>
									<span data-tkey="target_confirm">
									</span>
									<button id="target_confirm_yes" class="w3-margin-bottom w3-block w3-button w3-green w3-hover-light-green w3-margin-top" onclick="window.cryptid.game.targetShow();document.getElementById('targetConfirm').style.display = 'none';" data-tkey="target_yes_button"></button>
									<button id="target_confirm_no" class="w3-margin-bottom w3-block w3-button w3-red w3-hover-pale-red" onclick="document.getElementById('targetConfirm').style.display = 'none'" data-tkey="target_no_button"></button>
								</div>
								<img src="img/Cryptid_devil.png" class="cryptid-devil">
							</div>
						</div>
					</div>
					
					<!-- Sharing panel -->
					<div id="sharingDiv" class="w3-card cryptid-cream w3-margin-bottom">
						<div class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="share_title"></h4>
						</div>
						<div class="w3-padding">
							<button id="shareBtn" class="w3-block w3-button cryptid-highlight cryptid-hover-highlight w3-margin-bottom" onclick="window.cryptid.game.toggleSharePanel()" data-tkey="share_show_options"></button>
							<div id="shareOptions" class="cryptid-hide">
								<div class="w3-margin-bottom">
									<strong data-tkey="share_code_label"></strong>
									<div id="shareCode" class="w3-code w3-margin-top w3-margin-bottom" style="word-break:break-all;font-size:0.85em;cursor:pointer;" title="Click to copy code" onclick="window.cryptid.sharing.copyCodeText()"></div>
									<button id="shareCodeCopy" class="w3-button cryptid-highlight cryptid-hover-highlight" data-tkey="share_copy_link" onclick="window.cryptid.sharing.copyCode()"></button>
									<button id="shareFormatCycle" class="w3-button w3-small cryptid-highlight cryptid-hover-highlight w3-margin-left" style="padding:2px 8px;" onclick="window.cryptid.game.cycleShareFormat()">↺</button>
									<span id="shareFormatLabel" class="w3-small w3-margin-left" style="vertical-align:middle;"></span>
								</div>
								<div class="w3-margin-top">
									<strong data-tkey="share_links_label"></strong>
									<ol id="sharePlayerLinks" class="cryptid-list w3-left-align w3-small"></ol>
								</div>
							</div>
						</div>
					</div>

					<!-- End game dialog -->
					<div id="quitGame" class="w3-card cryptid-cream w3-margin-bottom">
						<div id="quitTitle" class="w3-left-align">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="quit_title"></h4>
						</div>
						<div class="w3-padding">
						<button id="quitButton" class="w3-margin-bottom w3-button w3-margin-top w3-block w3-button cryptid-highlight cryptid-hover-highlight" onclick="window.cryptid.game.endConfirm()" data-tkey="quit_button"></button>
						</div>
						<div id="quitConfirm" class="w3-modal">
							<div class="w3-modal-content cryptid-cream">
								<div class="w3-container w3-padding-large">
									<span onclick="document.getElementById('quitConfirm').style.display = 'none'" class="w3-button w3-display-topright">&times;</span>
									<br>
									<span data-tkey="quit_confirm">
									</span>
									<button id="quit_confirm_yes" class="w3-margin-bottom w3-block w3-button w3-green w3-hover-light-green w3-margin-top" onclick="window.cryptid.game.end();document.getElementById('quitConfirm').style.display = 'none';" data-tkey="quit_yes_button"></button>
									<button id="quit_confirm_no" class="w3-margin-bottom w3-block w3-button w3-red w3-hover-pale-red" onclick="document.getElementById('quitConfirm').style.display = 'none'" data-tkey="quit_no_button"></button>
								</div>
							</div>
						</div>
					</div>
					</div>

					<div class="game-start">	
					<!-- New game dialog -->
					<div id="newGameDialog" class="w3-card cryptid-cream w3-margin-bottom cryptid-hide">
						<div id="newGameCollapse" class="w3-left-align" onclick="">
							<h4 class="cryptid-title w3-alegreya w3-padding-small" data-tkey="new_title"></h4>
						</div>
						<form id="newGameForm" class="w3-padding w3-left-align" onsubmit="return false;">
							<div id="newGameFormContainer" class="w3-row">
								<div class="w3-margin-bottom">
									<label>
										<span data-tkey="new_no_players"></span>
										<select id="ngfPlayers" data-setting="players">
											<option value="2">2 (Variant)</option>
											<option value="3">3</option>
											<option value="4" SELECTED>4</option>
											<option value="5">5</option>
										</select>
									</label>
								</div>
								<div class="w3-card w3-yellow w3-margin-bottom w3-padding cryptid-hide" id="twoPlayerWarn">
									<span data-tkey="two_player_warn"></span>
								</div>
								<div class="w3-margin-bottom">
									<label class="switch cryptid-valign-middle w3-margin-right">
										<input type="checkbox" id="ngfMode" data-setting="advanced">
										<span class="slider round"></span>
									</label>
									<label id="ngfModeLabel" for="ngfMode" data-tkey="new_intro_label"></label> <img class="w3-margin-left pointer" src="img/help.png" alt="Help" onclick="document.getElementById('introHelp').style.display = 'block'" />

									<div id="introHelp" class="w3-modal">
										<div class="w3-modal-content cryptid-cream">
											<div class="w3-container w3-padding-large">
												<span onclick="document.getElementById('introHelp').style.display = 'none'" class="w3-button w3-display-topright">&times;</span>
												<span data-tkey="help_intro">
												</span>
											</div>
										</div>
									</div>
								</div>
								<div id="keepMapToggle" class="w3-margin-bottom cryptid-hide">
									<label class="switch cryptid-valign-middle w3-margin-right">
										<input type="checkbox" checked="checked" id="ngfKeepMap" data-setting="keep">
										<span class="slider round"></span>
									</label>
									<label id="ngfKeepLabel" for="ngfKeepMap" data-tkey="new_keep_label"></label>
								</div>
								<button id="ngfStart" class="w3-block w3-button cryptid-highlight cryptid-hover-highlight  w3-margin-bottom" data-tkey="new_start_button" disabled></button>
							</div>
						</form>
					</div>
					</div>

				<!-- Error modal. Diplsay using function in gameController, pass in error text -->
					<div id="errorBox" class="w3-modal">
						<div class="w3-modal-content  w3-light-green">
							<div class="w3-container w3-padding-large">
								<span id="errorText">
								</span>
								<br>
								<button class="w3-button w3-green w3-margin-top" data-tkey="general_ok" onclick="window.cryptid.game.error().close()"></button>
							</div>
						</div>
					</div>
					</div>
				</div>
			</div>
        </div>
    </body>
